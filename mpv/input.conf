# --- Upscaler A/B bank ---------------------------------------------------------
# Each slot re-asserts cscale=ewa_lanczos. Currently redundant (nothing sets a
# different cscale any more, since the YCbCr model was dropped) but kept as a
# guard: any future slot that changes the chroma path would otherwise leak that
# setting into every other slot after a single press.
# F1 = the base mpv.conf shader. NOTE: it is NOT what plays on every file --
# the [light-shader] profile auto-drops to C4F16_DS whenever the
# source pixel rate (w*h*fps) exceeds 85 Mpx/s, i.e. anything at or above
# 1080p50 / 1440p24. On those files F1 is an upgrade that will drop frames, and
# F2 is the actual "back to normal". F3 prints the numbers to check by hand.
F1 set cscale ewa_lanczos ; change-list glsl-shaders set "~~/shaders/ArtCNN_C4F32_DS.glsl" ; show-text "Shader: C4F32_DS (heavy, sharpens) [base default, <=85 Mpx/s]"
F2 set cscale ewa_lanczos ; change-list glsl-shaders set "~~/shaders/ArtCNN_C4F16_DS.glsl" ; show-text "Shader: C4F16_DS (light, sharpens) [auto above 85 Mpx/s]"
# Deband A/B toggle -- ON by default, so this key turns it OFF.
# Fixes stair-stepped gradients (skies, dark scenes), which is a different
# artifact class from what the ArtCNN shader repairs.
# (The ArtCNN R4F32_YCbCr models are deliberately absent: R4F32_YCbCr_DN lagged
# at 1080p60 AND at 1080p24 on an RTX 4080 SUPER, so it is not viable at any
# frame rate here.)
F5 cycle deband ; show-text "deband: ${deband}  (grain ${deband-grain})"
# Softening sibling of F1 (DN = denoise+soften, DS = denoise+sharpen), kept
# for A/B against the sharpening default.
F6 set cscale ewa_lanczos ; change-list glsl-shaders set "~~/shaders/ArtCNN_C4F32_DN.glsl" ; show-text "Shader: C4F32_DN (heavy, softens)"
# BASELINE: no ML upscaler at all. ArtCNN is anime-trained -- for live-action
# YouTube this is the honest comparison, not just a fallback.
F7 set cscale ewa_lanczos ; change-list glsl-shaders clr "" ; show-text "Shader: OFF (conventional scaling only)"
# Independent luma-scaler toggle -- deliberately NOT folded into the slots above,
# so it composes with any of them instead of leaking between them.
F8 cycle-values scale ewa_lanczossharp ewa_lanczos ; show-text "scale: ${scale}"
F3 show-text "fmt=${file-format}  vcodec=${video-codec}  ${width}x${height}@${container-fps}  vbr=${video-bitrate}  audio=${audio-codec}  shader=${glsl-shaders}" 5000
F4 cycle-values loop-file inf no ; show-text "Loop: ${loop-file}"
F10 script-binding chat_overlay/toggle
# Emote animation on/off, for A/B-ing its cost. Bounded to ANIM_MAX(16)
# images x ANIM_FPS(20) overlay updates per second regardless of chat volume.
F11 script-binding chat_overlay/toggle-anim
# Queue mode toggle (queue_mode.lua): ON = browser handoffs append instead of
# replace + loop-playlist=inf; OFF = back to replace + no loop. Both off by
# default. Same toggle is bindable as a KDE global shortcut via
# ~/.local/bin/mpv-queue-toggle (for when the browser has focus).
F9 script-binding queue_mode/toggle

# Japanese to English subtitles (translate_subs.lua). Off until pressed, on
# purpose: nothing is downloaded and no model is loaded before this key. A
# background worker fetches the original audio track, transcribes and
# translates it far ahead of playback, and mpv shows the result as an ordinary
# subtitle track. Pressing again removes the track and stops the worker.
F12 script-binding translate_subs/toggle
# Japanese chat to English, independent of F12: it works on Twitch as well and
# needs no subtitles. F12 also switches it on, and this key overrides that
# either way for the rest of the file.
# NOT Ctrl+F12: KDE binds that globally to minimise every window, so it never
# reaches mpv.
Shift+F12 script-binding chat_overlay/toggle-translate
# `h` = key-binding cheat sheet (keyhelp.lua binds it itself, no line needed
# here). It PARSES this file, so a new binding shows up automatically; give it a
# pretty label by adding the key to DESC in keyhelp.lua. `?` = mpv's built-in
# stats script, which lists every binding raw and complete.

# Volume: UP/DOWN arrows (overrides default seek ±60s)
UP   add volume  5
DOWN add volume -5

# Speed: +/- (multiplicative, matches mpv default [/] semantics)
+      multiply speed 1.1   ; show-text "Speed: ${speed}x"
-      multiply speed 1/1.1 ; show-text "Speed: ${speed}x"
KP_ADD      multiply speed 1.1   ; show-text "Speed: ${speed}x"
KP_SUBTRACT multiply speed 1/1.1 ; show-text "Speed: ${speed}x"
BS     set speed 1.0          ; show-text "Speed: 1.0x"

# Keypad 0: back to the start of the video. Bound twice on purpose, since the
# keypad sends KP0 with num lock on and KP_INS with it off, and the key is the
# same key either way. `absolute` is seconds, not a percentage.
KP0     seek 0 absolute ; show-text "Back to the start"
KP_INS  seek 0 absolute ; show-text "Back to the start"

# ESC: disable default exit-fullscreen
ESC ignore

# --- Renderer (RTX 4080 SUPER, Wayland HDR session) ---
vo=gpu-next
# vulkan rather than opengl: opengl breaks the ArtCNN upscaler and leaves a
# black window while paused.
gpu-api=vulkan
# vulkan-swap-mode=immediate lives in the ff2mpv wrapper, not here: it tears on
# local fullscreen files (KWin allows fullscreen tearing + direct scanout), and
# the NVIDIA/KWin freeze it works around only ever hit playlist skips driven
# from the OSC, i.e. browser-handoff sessions. Local playback stays vsync'd.
# Fewer in-flight frames around swapchain recreation on track change.
swapchain-depth=1
# auto instead of vulkan: hwdec=vulkan silently failed for AV1 (16 dav1d sw threads
# at 4K). auto tries vulkan first, falls back to a copy mode for AV1.
hwdec=auto
profile=high-quality

# --- AI upscaler: heavy by default, see [light-shader] at the bottom ---
# DS = denoise + SHARPEN (DN = denoise + soften). The two are near-identical in
# practice -- the shared denoise stage is what visibly removes macroblocking and
# sharpens text -- with DS slightly ahead on live action. F6 switches to DN.
glsl-shaders="~~/shaders/ArtCNN_C4F32_DS.glsl"

# --- Scaling ---
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
linear-downscaling=no

# --- Debanding: ON by default ---
# Fixes a DIFFERENT artifact than ArtCNN: the shader rebuilds edges/detail,
# deband fixes stair-stepped gradients (skies, dark scenes) that compression
# quantises. mpv's high-quality profile no longer enables this in 0.41.
# grain 16 (default is 48): heavy grain works against the shader's denoising.
# Raise it if banding still shows through.
# Worth having even on high bitrate streams: dark low-code-value gradients are
# exactly where 8-bit banding survives a high bitrate, so a comparison on bright
# material will show no difference at all and prove nothing. F5 toggles it live.
deband=yes
deband-grain=16

# --- HDR: native passthrough, no fake SDR->HDR stretch ---
tone-mapping=spline

# --- Color tweaks, to taste, for the HDR Wayland session ---
brightness=0
saturation=10

# --- yt-dlp: prefer YouTube Premium "Enhanced bitrate" (any codec), fallback to best ---
# format_note match works across itags (356 vp9 / 721 av01 / 616 vary by video)
ytdl-format=bv*[format_note*=Premium]+ba/bv*+ba/best

# --- YouTube Premium auth: LIVE read from browser profile (no stale snapshot) ---
# yt-dlp pulls fresh rotating SIDTS from the browser's cookies.sqlite each play ->
# never expires while logged in there. browser-profile = space-free symlink to the
# real profile dir; repoint it (ln -sfn) when switching browsers, mpv.conf unchanged.
# NOTE: must point at the browser you actually BROWSE in — a profile you stopped
# using no longer refreshes the rotating SIDTS, so auth silently rots over days.
# Old snapshot method, do NOT go back to it (SIDTS froze -> "logged out" every few
# hours): ytdl-raw-options=cookies=<exported cookies.txt>. Nothing plaintext on disk.
# mark-watched= (empty value = boolean flag): sends videostats playback ping so the
# video lands in YouTube watch history (fixes stale recommendations). Marks at load
# time, binary watched-flag only — no watchtime/resume-position sync.
ytdl-raw-options=cookies-from-browser=firefox:/home/tobi/.config/mpv/browser-profile,mark-watched=

# --- Cache: keep whole stream in RAM (defaults: 150MiB fwd / 50MiB back) ---
# Back buffer is what gets evicted when seeking back / looping -> redownload.
# 2 GiB each; ceiling not reservation — only used as the stream fills it.
cache=yes
demuxer-max-bytes=3GiB
demuxer-max-back-bytes=3GiB

# --- Screenshots ---
# Without screenshot-dir mpv writes into its CURRENT WORKING DIRECTORY, which is
# whatever the launcher happened to have -- "/" for a .desktop entry and for the
# ff2mpv handoff, so every screenshot failed with "error writing screenshot"
# unless mpv was started from a terminal. Named directory, created if missing.
screenshot-dir=~/Pictures/mpv
# Default template is mpv-shot%n, a bare counter that says nothing about the
# source and restarts per directory. Title plus wall-clock time is greppable.
# QUOTES REQUIRED. A config-file value that starts with % is read as mpv's
# fixed-length quoting (%<len>%<text>), so the unquoted form is rejected at
# startup with "fixed-length quoting expected" and the default silently stays.
screenshot-template="%tY-%tm-%td_%tH-%tM-%tS_%F"
screenshot-format=png

# --- Misc ---
keep-open=yes
save-position-on-quit=yes
# Store the URL/path as a comment inside each watch_later file.
# Those files are named MD5(exact URL string) — without this you cannot tell
# which entry belongs to which video, and a URL that gained a &t=/&si= param
# looks like "resume broke" with no way to confirm. Existing files unaffected.
write-filename-in-watch-later-config=yes
# ONE NAME PER LINE. `watch-later-options-remove` deletes exactly ONE item;
# given a comma list it looks the whole "sub-pos,vid,brightness" string up as a
# single item, finds nothing and silently does nothing -- measured, 47 options
# still in the list with the comma form against 43 with these four lines, while
# ModernZ's "sub_margins conflict" warning kept reporting the miss. Trailing
# comments are fine, the comma is the bug.
watch-later-options-remove=sub-pos      # ModernZ shifts sub-pos at runtime
watch-later-options-remove=vid          # accidental hotkey press must not persist (audio-only no-window bug)
watch-later-options-remove=brightness   # same
watch-later-options-remove=volume       # owned by scripts/volume_per_file.lua: mpv saves NOTHING for a file that reached EOF, and volume is global so it leaks to the next file
osc=no   # built-in OSC off; ModernZ (vendored in ~/.config/mpv/scripts/) replaces it

# --- Window: open fullscreen on the 42" 4K TV (HDMI-A-1, 2160p@60) ---
fullscreen=yes
fs-screen-name=HDMI-A-1
screen-name=HDMI-A-1

# --- Auto: lighter shader once the source exceeds the GPU's pixel budget ---
# The cost of an ArtCNN pass is per SOURCE pixel, and it must be paid once per
# frame -- so the thing that actually decides whether C4F32 keeps up is the
# source PIXEL RATE (w * h * fps), not resolution or frame rate on their own.
# That is why 1080p60 drops frames while 1080p30 does not: same pixels, twice
# the rate.
#
# Where 85 Mpx/s comes from: 1080p60 = 124 Mpx/s and renders at ~53 of 60 fps
# on the 4080 SUPER (~12% drops, measured), which puts the heavy shader's
# sustained ceiling near 110 Mpx/s. 85 leaves ~25% headroom for deband, the
# ewa_lanczos passes and HDR tone-mapping, which are not in that measurement.
#
# Reference points (source Mpx/s):
#     720p60   55  heavy      1080p30   62  heavy     1440p24   88  light
#    1080p50  104  light      1440p30  111  light     1080p60  124  light
#    2160p24  199  light      1440p60  221  light     2160p60  498  light
# A plain height rule cannot express this: 1440p24 at 88 Mpx/s and 1080p60 at
# 124 Mpx/s both need the light model, and only one of them is tall.
#
# Fallbacks: w/h are nil before the video params are known -> `or 0` makes the
# product 0 (heavy) rather than erroring out of the cond. container-fps is nil
# for images and some streams -> assume 30 rather than 0, so an unknown-fps 4K
# source still lands on the light shader instead of defaulting to heavy.
[light-shader]
profile-cond=(p["video-params/w"] or 0)*(p["video-params/h"] or 0)*(p["container-fps"] or 30)>85000000
profile-restore=copy
glsl-shaders="~~/shaders/ArtCNN_C4F16_DS.glsl"

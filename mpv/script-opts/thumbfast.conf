# User override of /etc/mpv/script-opts/thumbfast.conf (whole-file override, not merged)

# Enable on network playback — primary use case is YouTube via ff2mpv,
# without this no thumbnails on streams. Thumbnailer grabs a low-res copy
# in the background via yt-dlp.
network=yes

# Thumbnail generation size (display size on 4K is scaled by ModernZ)
max_height=200
max_width=200

# Spawn thumbnailer at file load so first hover isn't empty
spawn_first=yes

# Seek bar previews, see scripts/seek_preview.lua. Every value here is the
# shipped default.

# Largest preview picture in pixels. The picture keeps the video's shape inside
# this box, so a 16:9 video gets 480x270. Each picture costs width x height x 4
# bytes of RAM, 518 KB at this size. Storyboard pictures never get sharper than
# YouTube's 320x180 and are stretched to this size.
max_width=480
max_height=480

# Size of one slice copied out of the cache, in megabytes. Copying stalls the
# playback thread while it writes, 13 ms for 35 MB was measured, so keep it
# small.
slice_mb=24

# Most RAM the keyframe pictures of one video may use, in megabytes. A long
# video keeps fewer pictures instead, at 480x270 about one per 4 s for an hour.
ram_mb=512

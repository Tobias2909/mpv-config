# Japanese to English subtitles. Every value here is the shipped default, so
# the file documents the knobs as much as it sets them.

# Run the language probe on every YouTube file. The probe is a metadata lookup
# only, no audio and no GPU, and it never starts the worker by itself.
probe=yes
# Say on screen when a video is eligible.
announce=yes

# What to do with speech that was already in English.
#   suppress  drop those cues, so subtitles appear only for Japanese
#   off       keep everything
# The decision is made on the transcript's script, not on the audio, because
# per segment audio language ID was measured unreliable at cue length and
# wrongly flagged plainly Japanese lines. Katakana counts as Japanese, so
# loanword English inside a Japanese sentence is kept.
filter_english=suppress
# Share of latin letters above which a line counts as English.
latin_threshold=0.5
# Japanese term to english replacements applied to the source before
# translation, tab separated, one pair per line, lines starting with a hash
# ignored. Leave empty to use ~/.config/mpv/translate-glossary.tsv when it
# exists. Proper nouns are the one thing the translator cannot get right by
# itself, so this is where names and coined terms go.
glossary=
# Lines shorter than this are never judged.
min_chars=3

# Models. Swapping the translator is a one line change here, no code involved.
asr_model=large-v3
mt_model=entai2965/sugoi-v4-ja-en-ctranslate2
device=cuda
beam_size=5

# The worker always works towards covering the WHOLE video, and only varies
# how fast. A gap this many seconds ahead of the playhead counts as urgent and
# is transcribed at full speed, because the viewer has no subtitles there.
# Everything else is filled in the background.
lookahead=180
# What happens once the window in front of the playhead is covered.
#   whole  carry on and transcribe the entire video. Seeking anywhere is
#          instant afterwards, but the card stays busy for several minutes.
#   ahead  stop there and idle. The card stays nearly free, but seeking to a
#          part never visited waits a few seconds for it to catch up.
# Either way, audio the viewer is sitting on with no subtitles is always
# transcribed at full speed.
fill=whole

# Downloaded audio is kept beside the cues so a later session does not fetch
# it again, and is deleted as soon as a video is fully transcribed. In ahead
# mode a video is normally never finished, so this also drops audio nobody has
# come back to. Around fifty megabytes per hour of video. 0 keeps it for ever.
audio_cache_days=7
# Keep total cached audio under this many megabytes, oldest dropped first.
# 0 disables. Audio is effectively the whole cache, around 50 MB per hour of
# video against 40 KB of cues, and only the audio is ever dropped because the
# cues cost gpu minutes to rebuild while the audio takes seconds to fetch.
audio_cache_mb=2000

# Seconds of audio per transcription pass. Smaller reacts to seeking sooner,
# larger wastes less time restarting.
chunk=120
# Never do less work than this in one pass. The gap left to fill at the leading
# edge of the window is whatever playback has just uncovered, a second or two,
# and transcribing that on its own made the worker recognise the same speech
# again and again with slightly different boundaries.
min_clip=120
# Already covered audio handed to the recogniser before the gap, as a running
# start, so no sentence is cut at a cold clip boundary.
clip_back=15
# Voice activity detection. Off on purpose. The detector removes what it judges
# to be non-speech before the recogniser sees it, so anything it misjudges
# produces no subtitle at all, and on noisy audio with overlapping voices
# that was 7 percent of the speech against 3 percent with it off, in
# stretches of up to 24 seconds. It costs throughput, 25x realtime against
# 12x, and staying ahead of playback needs about 3x.
vad=no
# Treat the video as watched through when the playhead got this close to the
# end. The cached audio is dropped then, since it is only needed again for a
# stretch that was skipped and refetching costs seconds.
watched_slack=60
# Group recogniser segments into whole clauses before translating, so the
# translator is given a sentence with its predicate rather than a fragment.
# Boundaries come from sentence final punctuation, from real silence between
# words, and from short acknowledgements, which are turns of their own.
merge=yes
# Silence between words that ends a group.
merge_gap=0.4
# Show a translated clause on the timings of the speech it came from, rather
# than as one cue lasting the whole clause. A clause is what the translator
# needs, a cue that follows the speech is what the viewer needs, and this is
# how a human subtitler serves both.
split_cues=yes
# A cue is never displayed longer than max_cue, which stops a stuck looking
# subtitle when the recogniser hands back one very long segment, and never
# shorter than min_cue unless the following cue starts sooner.
max_cue=7
min_cue=1
# Translate a partial batch after this many seconds, so the first subtitle
# after a seek does not wait for a full batch of clauses.
emit_after=2.5
# Share of the wall clock the background fill may use. The idle time is spread
# between individual speech segments rather than between chunks, so the GPU
# load stays level instead of swinging between full and idle every few seconds.
# Raise it to finish sooner, lower it if the picture stutters. Work near the
# playhead ignores this and always runs at full speed, so lowering it never
# delays subtitles where you are actually watching.
duty=0.8
# After a seek, restart transcription this far before the new position.
rewind=5

# Reload controls. Re-reading the file blanks the shown cue for a few
# milliseconds, so reload rarely and prefer a gap between cues.
reload_interval=20
reload_defer_max=5

# How often to publish the playback position and look for new cues.
poll=1.0
